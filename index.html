// ---- Components -------------------------------------------------------------

function Meter({ label, value, max, color, isFund }) {
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  const display = isFund ? '$' + value.toLocaleString() : value + '%';
  return (
    <div className="flex-1 min-w-[180px]">
      <div className="flex justify-between text-xs sm:text-sm mb-1 font-sans">
        <span className="font-semibold tracking-wide" style={{color: 'var(--hca-navy)'}}>{label}</span>
        <span className="font-mono font-bold" style={{color: 'var(--hca-navy)'}}>{display}</span>
      </div>
      <div className="h-3 rounded-full bg-slate-200 overflow-hidden">
        <div className="meter-bar h-full rounded-full" style={{width: `${pct}%`, background: color}} />
      </div>
    </div>
  );
}

function ProgressStepper({ chapterIdx }) {
  return (
    <div className="flex items-start max-w-3xl mx-auto px-2">
      {CHAPTERS.map((step, i) => {
        const done = i < chapterIdx;
        const active = i === chapterIdx;
        return (
          <React.Fragment key={step.id}>
            <div className="flex flex-col items-center shrink-0 w-12 sm:w-16">
              <div
                className={`w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-bold font-sans transition ${
                  active
                    ? 'bg-blue-600 text-white ring-4 ring-blue-100'
                    : done
                      ? 'bg-green-600 text-white'
                      : 'bg-slate-200 text-slate-500'
                }`}
              >
                {done ? '✓' : i + 1}
              </div>
              <span
                className={`text-[10px] sm:text-xs font-sans mt-1 text-center whitespace-nowrap leading-tight ${
                  active ? 'text-blue-900 font-semibold' : done ? 'text-green-700' : 'text-slate-400'
                }`}
              >
                {step.label}
              </span>
            </div>
            {i < CHAPTERS.length - 1 && (
              <div
                className={`flex-1 h-0.5 mt-[11px] mx-0.5 sm:mx-1 transition ${
                  done ? 'bg-green-400' : 'bg-slate-200'
                }`}
              />
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function Header({ wellness, fund, chapterIdx }) {

    <header className="sticky top-0 z-10 bg-white/95 backdrop-blur border-b shadow-sm">
      <div className="max-w-4xl mx-auto px-4 pt-3 pb-2 flex gap-6 items-center">

        <Meter label="Assistance Fund" value={fund} max={START_FUND} color="var(--hca-blue)" isFund />
      </div>
      <div className="border-t border-slate-100 py-2.5">
        <ProgressStepper chapterIdx={chapterIdx} />
      </div>
    </header>
  );
}

function Card({ children, className = "" }) {
  return (
    <div className={`bg-white rounded-2xl shadow-md border border-slate-200 p-6 sm:p-8 fade-in ${className}`}>
      {children}
    </div>
  );
}

function PrimaryButton({ children, onClick }) {

    <button

      className="btn-primary px-6 py-3 rounded-full font-sans font-semibold tracking-wide shadow hover:shadow-lg transition"
    >
      {children}
    </button>
  );
}

function BackLink({ label, onClick }) {
  if (!onClick) return null;
  return (
    <button
      onClick={onClick}
      className="font-sans text-sm text-slate-500 hover:text-blue-700 transition flex items-center gap-1 mb-4"
    >
      <span aria-hidden="true">←</span> Back to {label}
    </button>
  );
}

function TermCard({ term }) {
  const cat = CATEGORIES[term.category];
  return (
    <div
      className="bg-white rounded-xl border-2 p-5 sm:p-6 h-full flex flex-col fade-in shadow-sm hover:shadow-md transition-shadow"
      style={{borderColor: cat.accentBorder}}
    >
      <div className="flex items-center gap-2 mb-3" style={{color: cat.accent}}>
        {cat.icon}
        <span className="font-sans uppercase tracking-widest text-[10px] sm:text-xs font-bold">{cat.label}</span>
      </div>
      <h3 className="text-xl sm:text-2xl font-bold mb-3" style={{color: 'var(--hca-navy)'}}>{term.term}</h3>
      <p className="text-slate-800 text-sm sm:text-base leading-relaxed preserve-newlines flex-1">{term.body}</p>
      {term.bullets && (
        <ul className="list-disc pl-5 mt-3 text-slate-800 text-sm sm:text-base space-y-1.5">
          {term.bullets.map((b, i) => <li key={i}>{b}</li>)}
        </ul>
      )}
    </div>
  );
}

function FeedbackScreen({ scenario, choice, onContinue, willFail }) {

  const delta = (n, isFund) => {
    if (n === 0) return null;
    const positive = n > 0;
    const color = positive ? 'text-green-700' : 'text-red-700';
    const arrow = positive ? '▲' : '▼';
    return (
      <span className={`font-mono font-bold ${color} ml-2`}>
        {arrow} {isFund ? '$' : ''}{Math.abs(n).toLocaleString()}{isFund ? '' : '%'}

    );

  return (
    <div className="max-w-5xl mx-auto px-4 py-8">
      <Card>
        <div className="flex items-center gap-3 mb-4">
          <span className={`inline-block w-3 h-3 rounded-full ${tierDot}`}></span>

          </div>

            <div className="bg-slate-100 rounded-lg p-4 font-sans text-sm">
              <div className="font-semibold text-slate-700 mb-2">Impact</div>

                <span className="text-slate-600">Assistance Fund</span>
                {delta(choice.dFund, true) || <span className="text-slate-400">—</span>}

            </div>
            <div className="text-center lg:text-left">

                {willFail ? 'See your final result' : scenario.nextContinue}

// ---- App --------------------------------------------------------------------

function App() {
  // Phases:
  //   'title' | 'intro' (with introIdx 1-3 for overview/goal/training) | 'guide'
  //   | 'inquiry' | 'terms' | 'advise' | 'feedback'
  //   | 'win' | 'lose_money' | 'lose_wellness'
  const [phase, setPhase] = useState('title');
  const [introIdx, setIntroIdx] = useState(0);
  const [scenarioIdx, setScenarioIdx] = useState(0);
  const [choice, setChoice] = useState(null);
  const [wellness, setWellness] = useState(START_WELLNESS);
  const [fund, setFund] = useState(START_FUND);

  // Scroll to top on every page change so long pages don't load mid-scroll.
  useEffect(() => {
    window.scrollTo({top: 0, left: 0, behavior: 'instant'});
  }, [phase, scenarioIdx, introIdx]);

  // Chapter mapping for the stepper:
  //   'welcome' covers all intro slides + guide
  //   each scenario is its own chapter (idx 1..4)
  //   'end' for win/lose_*
  function getChapterIdx() {
    if (phase === 'title' || phase === 'intro' || phase === 'guide') return 0;
    if (['inquiry', 'terms', 'advise', 'feedback'].includes(phase)) return 1 + scenarioIdx;
    return CHAPTERS.length - 1; // results
  }

  function startGame() { setIntroIdx(1); setPhase('intro'); }
  function advanceIntro() {
    if (introIdx < INTRO_SLIDES.length - 1) {
      setIntroIdx(introIdx + 1);
    } else {
      setPhase('guide');
    }
  }
  function guideToFirstClient() { setPhase('inquiry'); }
  function inquiryToTerms() { setPhase('terms'); }
  function termsToAdvise() { setPhase('advise'); }

  function makeChoice(c) {
    const newWellness = Math.max(0, Math.min(100, wellness + c.dWellness));
    const newFund = fund + c.dFund;
    setWellness(newWellness);
    setFund(newFund);
    setChoice(c);
    setPhase('feedback');
  }

  function nextStep() {
    const moneyOut = fund <= 0;
    const wellnessOut = wellness <= 0;
    if (moneyOut) {
      setPhase('lose_money');
      return;
    }
    if (wellnessOut) {
      setPhase('lose_wellness');
      return;
    }
    if (scenarioIdx >= SCENARIOS.length - 1) {
      setPhase('win');
      return;
    }
    setScenarioIdx(scenarioIdx + 1);
    setChoice(null);
    setPhase('inquiry');
  }

  function reset() {
    setPhase('title');
    setIntroIdx(0);
    setScenarioIdx(0);
    setChoice(null);
    setWellness(START_WELLNESS);
    setFund(START_FUND);
  }

  const showHeader = phase !== 'title';
  const chapterIdx = getChapterIdx();

  // Predict whether the next click will end the game (for the Continue button label)
  const willFail = useMemo(() => {
    if (phase !== 'feedback') return false;
    return (fund <= 0) || (wellness <= 0) || (scenarioIdx >= SCENARIOS.length - 1);
  }, [phase, fund, wellness, scenarioIdx]);

  return (
    <div className="min-h-screen">
      {showHeader && <Header wellness={wellness} fund={fund} chapterIdx={chapterIdx} />}
      {phase === 'title' && <TitleScreen onStart={startGame} />}
      {phase === 'intro' && (
        <IntroSlideScreen slide={INTRO_SLIDES[introIdx]} onContinue={advanceIntro} />
      )}
      {phase === 'guide' && <Guide onContinue={guideToFirstClient} />}
      {phase === 'inquiry' && (
        <InquiryScreen scenario={SCENARIOS[scenarioIdx]} onContinue={inquiryToTerms} />
      )}
      {phase === 'terms' && (
        <TermsReviewScreen
          scenario={SCENARIOS[scenarioIdx]}
          onContinue={termsToAdvise}
          onBack={() => setPhase('inquiry')}
        />
      )}
      {phase === 'advise' && (
        <AdviseScreen
          scenario={SCENARIOS[scenarioIdx]}
          onChoose={makeChoice}
          onBack={() => setPhase('terms')}
        />
      )}
      {phase === 'feedback' && choice && (
        <FeedbackScreen
          scenario={SCENARIOS[scenarioIdx]}
          choice={choice}
          onContinue={nextStep}
          willFail={willFail}
        />
      )}
      {phase === 'win' && <WinScreen wellness={wellness} fund={fund} onReset={reset} />}
      {phase === 'lose_money' && <LoseMoneyScreen wellness={wellness} fund={fund} onReset={reset} />}
      {phase === 'lose_wellness' && <LoseWellnessScreen wellness={wellness} fund={fund} onReset={reset} />}

      <footer className="text-center text-xs text-slate-500 py-6 font-sans">
        Health Care America &middot; Prototype rebuild from the original Captivate project
      </footer>
    </div>
  );
}

</script>
